# 求人デイリー (WBS 1.11.9): HR求人差分 + AW求人巡回(2フェーズ)
# AW求人はダウンロード生成待ち(最大20分)があるため create/collect の2フェーズで回す:
#   aw-create : login→「データを作成する」click(生成トリガーのみ, 待たない)→pending queueへ
#   aw-collect: login→生成済みを短時間ポーリングDL→LISTING upsert (待機なし)
# これで生成待ちを run 間に逃がし、1runが timeout に収まる。
#
# 状態(pending queue / セッション)は actions/cache で run 間保持。
# Secrets は応募連携workflowと共通。

name: Job Daily

on:
  schedule:
    # ── 求人の取り込みは日3回 (JST 1時 / 12時 / 20時) ──────────────
    # なぜ3回か: 応募の取り込みは5分ごとなので、求人が日1回だと
    # **その日に新しく掲載された求人へ来た応募が、求人より先にHubSpotへ入る**。
    # 実例 2026-08-06: 応募07:47:32 → 求人07:51:09 (3分37秒差)。現場は
    # 16:56 に「求人票が紐づいていない」と報告し、紐付いたのは22:24だった。
    # 求人を先回りさせて追い越しの窓を狭める (2026-08-07 ユーザー指示)。
    # ※ GitHubのcronは名目より遅れて着弾する(実測で数時間ずれる日がある)。
    #    完全には防げないので、応募側でも毎回 relink して取りこぼしを拾う。
    - cron: "0 16 * * *"    # JST 01:00  HR差分
    - cron: "0 3 * * *"     # JST 12:00  HR差分
    - cron: "0 11 * * *"    # JST 20:00  HR差分
    # AW-collect は生成待ちがあるので各回の20分後に置く
    - cron: "20 16 * * *"   # JST 01:20  AW-collect
    - cron: "20 3 * * *"    # JST 12:20  AW-collect
    - cron: "20 11 * * *"   # JST 20:20  AW-collect
    # AW応募起点ブートストラップ(導入期): 応募が来た社の求人を最新から遡って習得。
    # 求人が揃ったら停止してよい。毎時00分(高負荷)を避けてオフピーク分に置く。
    - cron: "23 1 * * *"    # JST 10:23
    - cron: "23 5 * * *"    # JST 14:23
    - cron: "23 9 * * *"    # JST 18:23
    # 取引まわりの健全性 (deal_hygiene job)。求人取込(JST 1時)の後に回す。
    - cron: "40 16 * * *"   # JST 01:40
  workflow_dispatch:
    inputs:
      phase:
        description: "フェーズ (hr / aw-create / aw-create-apps / aw-collect / deal-hygiene / reset-queue)"
        default: "hr"
        type: choice
        options: ["hr", "aw-create", "aw-create-apps", "aw-collect",
                  "deal-hygiene", "reset-queue"]
      apps_cutoff:
        description: "aw-create-apps の応募日カットオフ (ISO, 空=全件)"
        default: ""
      target_login_ids:
        description: "AW対象 login_id (カンマ区切り, 空=--from-active-deals)"
        default: ""
      limit:
        description: "AW処理社数上限 (空=無制限)"
        default: ""
      dry_run:
        description: "ドライラン"
        type: boolean
        default: true

# ※ concurrency は job 単位で宣言する。ワークフロー単位にすると
#   求人取込(job)と取引まわり(deal_hygiene)が互いを待つ。

jobs:
  job:
    # 取引まわり専用の cron / 手動フェーズではこの job を動かさない。
    # GitHub は cron ごとに全 job を評価するため、除外しないと
    # PHASE決定の `*)` フォールバックで hr が誤爆する。
    if: >-
      github.event.schedule != '40 16 * * *' &&
      inputs.phase != 'deal-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: job-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore state (pending queue + sessions)
        uses: actions/cache@v4
        with:
          path: data/job_application_sync
          key: jas-job-state-v1-${{ github.run_id }}
          restore-keys: |
            jas-job-state-v1-
      - name: Install deps + Playwright
        run: |
          python -m pip install --upgrade pip
          # google-api-python-client: check_sheet_url_drift が顧客管理シートD列の
          # ハイパーリンクを includeGridData で読むのに googleapiclient を使う。
          # gspread では取れない。入れ忘れると毎回 ModuleNotFoundError で死ぬ
          # (applicant_sync.yml には入っている。2026-08-06 検証で発覚)。
          pip install playwright==1.50.0 requests python-dotenv gspread google-auth google-auth-oauthlib openpyxl google-cloud-storage google-api-python-client
          python -m playwright install --with-deps chromium chromium-headless-shell
      - name: Write SA json
        env:
          SA_JSON_CONTENT: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$SA_JSON_CONTENT" > /tmp/sa.json
      - name: Job daily
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          HRHACKER_USER: ${{ secrets.HRHACKER_USER }}
          HRHACKER_PASS: ${{ secrets.HRHACKER_PASS }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          GOOGLE_SA_JSON: /tmp/sa.json
          SHEETS_AUTH_MODE: sa
          JAS_SHEET_ID: ${{ secrets.JAS_SHEET_ID }}
          JAS_APPLICANT_QUEUE_SHEET_ID: ${{ secrets.JAS_APPLICANT_QUEUE_SHEET_ID }}
          SLACK_APPLICANT_ALERT_WEBHOOK: ${{ secrets.SLACK_APPLICANT_ALERT_WEBHOOK }}
          PYTHONIOENCODING: utf-8
          # cron実行時は inputs が無く既定'hr'になっていた(=aw-collect cronもHRを実行して
          # いた潜在バグ)。schedule→phase を明示マッピングして是正(2026-07-23)。
          PHASE_IN: ${{ inputs.phase }}
          SCHEDULE: ${{ github.event.schedule }}
          APPS_CUTOFF_IN: ${{ inputs.apps_cutoff }}
          TARGET: ${{ inputs.target_login_ids }}
          LIMIT: ${{ inputs.limit }}
        run: |
          # PHASE 決定: 手動dispatchは inputs 優先、cron は schedule から引く。
          PHASE="$PHASE_IN"
          if [ -z "$PHASE" ]; then
            case "$SCHEDULE" in
              # 求人取込(日3回) JST 1/12/20時
              "0 16 * * *"|"0 3 * * *"|"0 11 * * *")        PHASE="hr" ;;
              # AW回収は各回の20分後
              "20 16 * * *"|"20 3 * * *"|"20 11 * * *")     PHASE="aw-collect" ;;
              "23 1 * * *"|"23 5 * * *"|"23 9 * * *")       PHASE="aw-create-apps" ;;
              # ★ここに来たら cron を足して case を更新し忘れている。
              #   黙って hr にすると重いジョブが想定外の時刻に走るので落とす。
              *) echo "::error::未知のschedule '$SCHEDULE' — caseの更新漏れ"; exit 1 ;;
            esac
          fi
          echo "PHASE=$PHASE (schedule='$SCHEDULE')"
          # 応募起点の既定カットオフ: 直近60日(求人が生きている可能性が高い窓)
          APPSCUT="$APPS_CUTOFF_IN"
          [ -z "$APPSCUT" ] && APPSCUT=$(date -u -d '60 days ago' +%Y-%m-%d)
          # hr_watcher は --dry-run/--actual 両対応、aw_orchestrator は --actual のみ
          # (dry-runが既定) なので媒体別にフラグを分ける。
          # schedule実行は本番automation = 常にactual (2026-07-25: inputs無し→dry-run既定に
          # 落ち、dry-run collectがLISTINGを作らずキューだけ消費する事故が起きた)。
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            FLAG="--actual"; AWFLAG="--actual"
          else
            FLAG="--dry-run"; AWFLAG=""
          fi
          TGT=$([ -n "$TARGET" ] && echo "--target-login-ids $TARGET" || echo "--from-active-deals")
          # incremental: 全社一斉を避け既定20社/run(未指定時)。ローテーションで全社を順次。
          LIM=$([ -n "$LIMIT" ] && echo "--limit $LIMIT" || echo "--limit 20")
          # collect は login+生成物ポーリングで1社が重い。parallel 3 × 15社で
          # job timeout(30分)内に必ず完了させる(旧: 全件gather→毎回timeout cancel→
          # _save_queue不達で永久停滞していた 2026-07-22 修正)。
          LIMC=$([ -n "$LIMIT" ] && echo "--limit $LIMIT" || echo "--limit 15")
          case "$PHASE" in
            hr)
              python scripts/job_application_sync/hr_watcher.py $FLAG --skip-aw
              # ★取引側の店舗ID(hrhacker_shop_ids)をその日のCSVで補完する。
              #   ここに置く理由: hr_watcher が scratchpad/csv_fetched/hr へ
              #   落とした**最新CSVが同じジョブ内にある**ため受け渡しが要らない。
              #   これが無いと新しい店舗の取引に鍵が入らず、
              #   sync_deal_association(deal_hygiene 01:40) が引けない。
              #   実測(2026-08-10): 未紐付け求人の店舗ID31種のうち、2026-07-03の
              #   固定CSVでは8種しか載っておらず残りは永久に補完できなかった。
              #   和集合マージなので既存値は消えない。冪等。
              python scripts/job_application_sync/backfill_deal_shop_id_via_email.py                 $FLAG || echo "::warning::店舗ID補完が失敗(本線は継続)"
              # ※ 取引まわりの処理(紐付け/一次対応/健全性)は deal_hygiene job へ
              #   切り出した(2026-08-06)。ここに置くと (1)Playwrightの求人取込が
              #   落ちた時に後続が丸ごと実行されない (2)同じconcurrency groupの
              #   aw-collect を待たせる (3)30分のtimeoutに収まらない、の3つが起きる。
              ;;
            aw-create)
              python scripts/job_application_sync/fetchers/aw_orchestrator.py \
                $TGT --phase create --parallel 2 $LIM
              ;;
            aw-create-apps)
              # 応募起点ブートストラップ(導入期): 応募が来た社の求人を一括習得。
              # 日常の aw-create(--from-active-deals)は温存。
              # mode=full(1ラン内で生成→待機→回収→LISTING化)で完結=キャッシュ共有キューの
              # clobber事故を回避(2026-07-23)。少数/ランで確実に。limit未指定なら3社。
              # 10社/run × 3回/日 = 30社/日 (2026-07-29 ユーザー決定)。206社を約1週間で
              # 一巡し、白紙プレースホルダを実求人データへ昇格させる。
              # mode=full は 1社あたり ~2.5分 → parallel 4 で 10社 ≈ 8-10分 (timeout 30分内)。
              LIMA=$([ -n "$LIMIT" ] && echo "--limit $LIMIT" || echo "--limit 10")
              python scripts/job_application_sync/fetchers/aw_orchestrator.py \
                --phase full --from-applications --actual \
                --applications-cutoff "$APPSCUT" --parallel 4 $LIMA
              ;;
            aw-collect)
              python scripts/job_application_sync/fetchers/aw_orchestrator.py \
                --phase collect $AWFLAG --parallel 3 $LIMC
              ;;
            reset-queue)
              # 保守用: AW pending queue を空にする。timeout座礁era(collectが
              # 完走せず生成物が期限切れ死骸化)に溜まったキューの一掃に使う(2026-07-22)。
              # cache restore済みのキューを{}で上書き→post-jobで空キャッシュ保存。
              python -c "import json,pathlib; p=pathlib.Path('data/job_application_sync/aw_pending_queue.json'); old=(len(json.loads(p.read_text(encoding='utf-8'))) if p.exists() else 0); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('{}',encoding='utf-8'); print(f'[reset-queue] aw_pending_queue cleared: {old} -> 0')"
              ;;
          esac

  # ── 取引まわりの健全性 ────────────────────────────────────────────
  # 求人取込(job)から切り出してある。理由は3つ:
  #   1. Playwrightの求人取込が落ちても、こちらは走る。hrに相乗りさせると
  #      `bash -e` により hr_watcher の失敗でこの5本が丸ごと実行されない
  #   2. concurrency group を分ける。同じgroupだと aw-collect を待たせる
  #      (cronの名目差は20分だが実着弾の差は12〜15分しかない)
  #   3. timeout を専用に持てる。この処理は求人34,718件を走査するので
  #      hrの30分枠には収まらない
  #
  # そもそもの発端: deal-assoc と ichijitaiou は applicant_sync.yml のモードと
  # してしか存在せず、同ファイルに schedule が無いため **GASの時間トリガーだけ**
  # が起動手段だった。実測で deal-assoc は10日(最終2026-07-27)、ichijitaiou は
  # 29日(最終2026-07-08) 起動されていなかった。GitHub側の cron で二重化する。
  deal_hygiene:
    if: >-
      github.event.schedule == '40 16 * * *' ||
      inputs.phase == 'deal-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deal-hygiene
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Playwrightは不要 (スクレイピングしない)。googleapiclient は
          # check_sheet_url_drift が顧客管理シートD列のリンクを読むのに要る。
          pip install requests python-dotenv gspread google-auth \
            google-auth-oauthlib google-api-python-client
      - name: Write SA json
        env:
          SA_JSON_CONTENT: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$SA_JSON_CONTENT" > /tmp/sa.json
      - name: Deal hygiene
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          GOOGLE_SA_JSON: /tmp/sa.json
          SHEETS_AUTH_MODE: sa
          JAS_SHEET_ID: ${{ secrets.JAS_SHEET_ID }}
          SLACK_APPLICANT_ALERT_WEBHOOK: ${{ secrets.SLACK_APPLICANT_ALERT_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: |
          # schedule実行は常に本番。手動dispatchは inputs.dry_run に従う。
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            FLAG="--actual"; SLACKFLAG="--slack"
          else
            FLAG="--dry-run"; SLACKFLAG=""   # 試し実行でSlackを撃たない
          fi
          RC_CODE=0; RC_ROLLUP=0; RC_INHERIT=0; RC_RPO=0; RC_ASSOC=0; RC_RELINK=0; RC_ICHIJI=0; RC_MEMO=0; RC_DRIFT=0; RC_HEALTH=0
          # 実行順序は依存関係で決まる:
          #   取引へ紐付け → 最新取引へ付け替え → 一次対応の転記
          #   → メモの転記 → 検知
          # ★先に取引側の鍵(管理用メール)を埋める。紐付けはこれを引くので順序が重要。
          #   顧客管理シートを直読みするので常に最新。既存値は触らない設計。
          #   これまで一度も定期実行されておらず、新規顧客の取引が空のままだった。
          # ★取引先コード(契約単位の安定キー)を最初に埋める。取引は契約更新の
          #   たびに作り替えられIDが変わるため、これが無いと前の取引に溜めた
          #   求人メモを新しい取引へ引き継げない。作成時点では計上がまだ無い
          #   (当日にあるのは41%)ので、未解決を毎晩ぜんぶ再挑戦する。
          python scripts/job_application_sync/backfill_deal_code_of_customer.py $FLAG $SLACKFLAG || RC_CODE=$?
          python scripts/job_application_sync/backfill_deal_rpo_mail.py $FLAG || RC_RPO=$?
          python scripts/job_application_sync/sync_deal_association.py $FLAG || RC_ASSOC=$?
          # 契約更新で新しい取引が作られた際の付け替え。sync_deal_association は
          # 「既に紐付いている求人」をスキップする設計なので、旧取引にぶら下がった
          # ままの求人はこちらでしか拾えない。追加のみ・判定不能はSlack通知。
          python scripts/job_application_sync/relink_to_latest_deal.py $FLAG || RC_RELINK=$?
          python scripts/job_application_sync/sync_ichijitaiou.py $FLAG || RC_ICHIJI=$?
          # 取引の暗黙知メモを配下の求人へ転記する。
          # メモの正は取引に置いてある(求人は出し直しで作り替えられるため)。
          # ここが無いと、取引でメモを直しても現場が見る求人には届かない。
          # 内容ハッシュで冪等: 同じ内容なら貼らない/変わったら貼り直す。
          # 紐付けが正しくなった後に走らせる(①②の後)。
          # ★求人メモ→取引への集約。転記(次行)より前に置く。逆にするとその晩に
          #   集約した内容が求人へ流れるのが翌日になる。作り直さず既存へ積み上げる
          #   (作り直すと求人の出し直しで失われたメモを毎晩取り込む)。
          # ★2026-08-31 ルーティンから外した (ユーザー決定)。
          #   運用ルールを「現場は取引のメモだけを編集する・求人には直接書かない」に
          #   統一したため、求人→取引の集約は不要になった。残しておくと、求人側に
          #   残った古いメモを毎晩取引へ積み戻し、コンサルが直した取引のメモが
          #   「変わっている」ように見える (2026-08-21〜 のエスカレーションの原因)。
          #   スクリプト自体は残す (必要になったら手動で1回だけ流す)。
          # python scripts/job_application_sync/rollup_memo_to_deal.py $FLAG || RC_ROLLUP=$?
          # ★契約をまたぐ引き継ぎ。集約の後・転記の前に置く。取引は契約更新で
          #   作り替えられIDが変わるため、取引先コードで束ねて旧取引のメモを
          #   生きている取引へ渡す。生存が複数のグループは貼らずに人へ回す。
          python scripts/job_application_sync/inherit_rollup_by_contract.py $FLAG $SLACKFLAG || RC_INHERIT=$?
          python scripts/job_application_sync/sync_deal_memo_to_listing.py $FLAG || RC_MEMO=$?
          # 顧客管理シートD列の貼り替えにHubSpotが追従しているかの検知。
          # 検知のみ・自動修正しない(人が編集する場所を機械が上書きしない)。
          python scripts/job_application_sync/check_sheet_url_drift.py $SLACKFLAG || RC_DRIFT=$?
          # 健全性チェック: 「動いたか」ではなく「あるべき状態か」を見る。
          # health_check.py は「チェック自体が失敗したら1を返す」設計なので
          # `|| true` で捨てない (監視の無音故障を作らないため)。
          python scripts/job_application_sync/health_check.py $SLACKFLAG || RC_HEALTH=$?
          echo "[deal_hygiene] rc: code=$RC_CODE rollup=$RC_ROLLUP inherit=$RC_INHERIT rpo=$RC_RPO assoc=$RC_ASSOC relink=$RC_RELINK ichijitaiou=$RC_ICHIJI memo=$RC_MEMO drift=$RC_DRIFT health=$RC_HEALTH"
          # 検知系(drift/health)も失敗判定に入れる。**監視が死んでいるのに緑**が
          # いちばん危険 (SKテックの誤転記55件はdriftでしか気づけない)。
          NG=""
          [ $RC_CODE   -ne 0 ] && NG="$NG 取引先コードの補完"
          [ $RC_ROLLUP -ne 0 ] && NG="$NG 求人メモの取引への集約"
          [ $RC_INHERIT -ne 0 ] && NG="$NG 契約をまたぐメモの引き継ぎ"
          [ $RC_ASSOC  -ne 0 ] && NG="$NG 求人→取引の紐付け"
          [ $RC_RELINK -ne 0 ] && NG="$NG 最新取引への付け替え"
          [ $RC_ICHIJI -ne 0 ] && NG="$NG 一次対応の転記"
          [ $RC_MEMO   -ne 0 ] && NG="$NG 暗黙知メモの転記"
          [ $RC_DRIFT  -ne 0 ] && NG="$NG 顧客シートURL乖離の検知"
          [ $RC_HEALTH -ne 0 ] && NG="$NG 健全性チェック"
          if [ -n "$NG" ]; then
            echo "::error title=取引まわりの日次処理が失敗::失敗した処理:$NG"
            exit 1
          fi
