# 専用PCの見張り (2026-11-19 決定)
# HR の応募の登録・求人の監視を専用PCへ移し、Actions を予備に残さないことにした。
# PC が止まると PC からは知らせられないので、PC が終わるたびに非公開シートのタブ
# 「PC稼働」へ書く時刻を、ここで 30 分おきに読み、古ければ Slack に送る。
#   応募 (HR応募): 30 分より古い / 求人 (HR求人): 13 時間より古い → 知らせる
#   止まったままなら 6 時間おきにもう一度、戻ったら 1 回知らせる (タブの D 列に記録)。
# 読むのはシート 1 枚だけ。HubSpot には触らない。Playwright は入れない。
# ※ GitHub の cron は遅れて着くことがある。見張りの遅れはその分だけ (止める処理ではない)。

name: PC Heartbeat Watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: pc-heartbeat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv gspread google-auth google-auth-oauthlib
      - name: Write SA json
        env:
          SA_JSON_CONTENT: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$SA_JSON_CONTENT" > /tmp/sa.json
      - name: Check
        env:
          GOOGLE_SA_JSON: /tmp/sa.json
          SHEETS_AUTH_MODE: sa
          JAS_APPLICANT_QUEUE_SHEET_ID: ${{ secrets.JAS_APPLICANT_QUEUE_SHEET_ID }}
          SLACK_APPLICANT_ALERT_WEBHOOK: ${{ secrets.SLACK_APPLICANT_ALERT_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: python scripts/job_application_sync/pc_heartbeat.py --check
