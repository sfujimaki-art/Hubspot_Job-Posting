# HR応募の取りこぼし照合 (毎朝, 2026-10-26)
#
# HRハッカーの応募一覧 (直近14日) と HubSpot の応募 (0-421) を突き合わせ、
# HubSpot に無い応募を通常の取り込み (run_import) で取り込み直す。
# 取り込みと同じ重複判定 (同じ人・同じ求人・同じ日) の既存は正しい重複として除く。
# 詳しくは scripts/job_application_sync/hr_reconcile.py の先頭。
#
# 開始日 (cutoff) を指定した Applicant Sync の回収を起動しないのは、回収もシート1の通知を
# 起点に読み、すでに台帳で DONE の通知は除外するため、取りこぼした応募が読まれないから。
#
# 公開リポ: ログ・Slack・Issue に出るのは 件数・日付・応募経路の番号・店舗ID・hash の先頭8文字まで。
# 応募の CSV は一時フォルダに置いて消す (artifact には上げない)。
#
# 必要 Secrets (応募連携と共通): HUBSPOT_ACCESS_TOKEN / HRHACKER_USER / HRHACKER_PASS /
#   SLACK_APPLICANT_ALERT_WEBHOOK

name: HR Reconcile

on:
  schedule:
    - cron: "15 22 * * *"   # JST 07:15 (夜の応募が通常の同期で入ったあと、朝の対応の前)

concurrency:
  group: hr-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.50.0 requests python-dotenv
          python -m playwright install --with-deps chromium chromium-headless-shell
      - name: Reconcile
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          HRHACKER_USER: ${{ secrets.HRHACKER_USER }}
          HRHACKER_PASS: ${{ secrets.HRHACKER_PASS }}
          SLACK_APPLICANT_ALERT_WEBHOOK: ${{ secrets.SLACK_APPLICANT_ALERT_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/job_application_sync/hr_reconcile.py --actual --import-missing --slack \
            --status-file "$RUNNER_TEMP/hr_reconcile.json"
      - name: 残ったら Issue
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/hr_reconcile.json"
          LEFT=$(jq -r '.remaining' "$S")
          echo "取り込み直したあとも残った件数: $LEFT"
          [ "$LEFT" -gt 0 ] || exit 0
          BODY=$(jq -r '"範囲: \(.range[0])〜\(.range[1])\nHRの応募: \(.checked) / 取り込み済み: \(.in_hubspot) / 正しい重複: \(.duplicate)\n取りこぼし: \(.missing) / 取り込み直し: \(.imported|tostring) / まだ無い: \(.remaining)\n\n| 応募日時 | 応募経路 | 店舗ID | key |\n|---|---|---|---|\n" + ([.remaining_items[] | "| \(.applied) | \(.route) | \(.shop_id) | \(.key) |"] | join("\n"))' "$S")
          BODY=$(printf '%s\n\n実行: %s' "$BODY" "$GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID")
          gh label create hr-reconcile -R "$R" --color FBCA04 --description "HR応募の取りこぼし" 2>/dev/null || true
          N=$(gh issue list -R "$R" --label hr-reconcile --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" -R "$R" --body "$BODY"
          else
            gh issue create -R "$R" --label hr-reconcile --title "HR応募の取りこぼしが取り込み直しても残っています" --body "$BODY"
          fi
