# 応募同期・求人同期・応募の照合が止まったときの自動修正 (2026-10-26)
#
# なぜ: 2026-10-25 21:11 から、ubuntu-latest が 26.04 に切り替わり Playwright が
#   入らなくなって、応募の取り込みが約13時間止まった。失敗はスクリプトより前
#   (ブラウザの導入) で起きたので、スクリプト内の Slack 報告も飛ばなかった。
#   取り込みが止まり続けるほうが、修正を自動で入れるより危ない (ユーザー判断)。
#
# 流れ:
#   1. 対象のワークフローの main の実行が終わるたびに起動する。
#   2. ジョブごとに結果を見る (Job Daily は求人取込 job と取引の健全性 deal_hygiene が
#      別の時刻に動き、動かなかった側は skipped になる。skipped は数えない)。
#      ジョブが失敗に変わった最初の回と、失敗のあと成功に戻った回を Slack に知らせる。
#   3. 同じジョブが続けて失敗した回数がしきい値 (応募同期 3 回 = 約15分 / ほか 1 回) に達したら、
#      Claude がリポ直下の CLAUDE.md と失敗のログを読み、実行環境の行だけを直す。
#   4. 直した差分と原因を Issue (ラベル auto-fix) に書き、Slack で知らせる。
#      マージは人が行う (Issue の差分を PR にしてマージする。手元の Claude Code に頼めばよい)。
#      ワークフローのファイルは Actions の標準の鍵 (GITHUB_TOKEN) では push できず、
#      このリポだけに絞った鍵も持ち主のアカウントでしか作れないため、push・マージはしない。
#   5. 開いている auto-fix の Issue があるあいだは、同じ失敗で Claude を何度も動かさない。
#
# Issue には「差分が実行環境の行だけか」の機械的な判定も書く (ALLOWED_FILES / ALLOWED_LINE / DENY_LINE)。
#
# 必要な Secrets:
#   ANTHROPIC_API_KEY または CLAUDE_CODE_OAUTH_TOKEN : Claude を動かす鍵 (どちらか一方)。
#   SLACK_APPLICANT_ALERT_WEBHOOK : 既存 (応募同期の失敗報告と同じ先)。

name: Auto Fix

on:
  workflow_run:
    workflows: ["Applicant Sync", "Job Daily", "HR Reconcile"]
    types: [completed]

concurrency:
  group: auto-fix
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  gate:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    outputs:
      fix: ${{ steps.check.outputs.fix }}
      job: ${{ steps.check.outputs.job }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          WF_ID: ${{ github.event.workflow_run.workflow_id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SLACK: ${{ secrets.SLACK_APPLICANT_ALERT_WEBHOOK }}
        run: |
          set -euo pipefail
          notify() { [ -n "$SLACK" ] && curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$1" '{text:$t}')" "$SLACK" >/dev/null || true; }
          # 直近10回の完了した実行 (新しい順。取り消しは除く) のジョブごとの結果
          : > jobs.jsonl
          for id in $(gh api "repos/$R/actions/workflows/$WF_ID/runs?branch=main&status=completed&per_page=10" \
                --jq '.workflow_runs[] | select(.conclusion=="success" or .conclusion=="failure") | .id'); do
            gh api "repos/$R/actions/runs/$id/jobs" --jq ".jobs[] | {run: $id, name, conclusion}" -c >> jobs.jsonl
          done
          # あるジョブの結果の並び (新しい順。skipped / cancelled / 未完了は数えない)
          hist() { jq -s -c --arg n "$1" '[.[] | select(.name==$n and (.conclusion=="success" or .conclusion=="failure")) | .conclusion]' jobs.jsonl; }
          # 先頭から続く failure の数
          streak() { jq '[foreach .[] as $c ({s:0,stop:false}; if .stop or $c!="failure" then .stop=true else .s+=1 end; .s)] | max // 0'; }
          THRESHOLD=1; [ "$WF_NAME" = "Applicant Sync" ] && THRESHOLD=3
          FIX=false; FIX_JOB=""
          while read -r line; do
            NAME=$(jq -r .name <<< "$line"); C=$(jq -r .conclusion <<< "$line")
            H=$(hist "$NAME"); PREV=$(jq -r '.[1] // "none"' <<< "$H")
            if [ "$C" = "success" ]; then
              [ "$PREV" = "failure" ] && notify "✅ $WF_NAME / $NAME が復旧しました: $RUN_URL"
              continue
            fi
            [ "$C" = "failure" ] || continue
            S=$(streak <<< "$H")
            [ "$PREV" != "failure" ] && notify "⚠️ $WF_NAME / $NAME が失敗しました。続いたら自動修正を試します: $RUN_URL"
            echo "$NAME: 連続失敗 $S 回 (しきい値 $THRESHOLD)"
            if [ "$S" -ge "$THRESHOLD" ] && [ -z "$FIX_JOB" ]; then FIX=true; FIX_JOB="$NAME"; fi
          done < <(jq -c --argjson r "$RUN_ID" 'select(.run==$r)' jobs.jsonl)
          if [ "$FIX" = true ]; then
            OPEN=$(gh issue list -R "$R" --label auto-fix --state open --json number --jq length 2>/dev/null || echo 0)
            if [ "$OPEN" -gt 0 ]; then echo "自動修正の Issue が開いているので待つ"; FIX=false; fi
          fi
          echo "fix=$FIX" >> "$GITHUB_OUTPUT"
          echo "job=$FIX_JOB" >> "$GITHUB_OUTPUT"

  fix:
    needs: gate
    if: needs.gate.outputs.fix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      FAILED_JOB: ${{ needs.gate.outputs.job }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SLACK: ${{ secrets.SLACK_APPLICANT_ALERT_WEBHOOK }}
      ALLOWED_FILES: |
        .github/workflows/applicant_sync.yml
        .github/workflows/job_daily.yml
        .github/workflows/hr_reconcile.yml
        requirements.txt
      # 実行環境の行とみなす変更行 (先頭の +/- を除いて照合)
      ALLOWED_LINE: '^\s*(runs-on:\s*[A-Za-z0-9._-]+\s*$|python-version:|-?\s*uses:\s*[A-Za-z0-9._/-]+@[A-Za-z0-9._-]+\s*$|pip install |python -m pip install --upgrade pip\s*$|python -m playwright install |[A-Za-z0-9_.-]+\s*(==|>=|~=)\s*[0-9][A-Za-z0-9.*]*\s*$)'
      # 許可行に当てはまっても止めるもの
      DENY_LINE: '(;|&&|\||\$\(|`| >|>>|curl|wget|--dry-run|--actual|secrets\.|--index-url|--extra-index-url|git\+|https?://)'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 失敗のログを取る
        run: |
          mkdir -p .autofix
          gh run view "$FAILED_RUN_ID" -R "$R" --log-failed | tail -n 400 > .autofix/failed.log || true
      - name: Claude が原因を調べて直す
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --max-turns 40
            --allowedTools Read,Edit,Write,Grep,Glob,Bash(cat:*),Bash(grep:*),Bash(tail:*),Bash(head:*),Bash(ls:*),Bash(git diff:*),Bash(git log:*),Bash(pip index:*),Bash(pip download:*)
          prompt: |
            GitHub Actions のワークフロー「${{ github.event.workflow_run.name }}」のジョブ「${{ needs.gate.outputs.job }}」が main で続けて失敗しています。
            失敗した回: ${{ github.event.workflow_run.html_url }}
            失敗した段のログの末尾は .autofix/failed.log にあります。

            最初にリポ直下の CLAUDE.md (運用手順書) を読み、そこに書いた決まりに従ってください。

            やること:
            1. ログとワークフローのファイル (.github/workflows/) を読み、失敗の原因を特定する。
               CLAUDE.md の「よくある失敗の型」に当てはまるかを先に確かめる。
            2. 原因が実行環境 (runner の OS、Python や Playwright などの版、action の版、パッケージの導入) なら、
               次のファイルの、その種類の行だけを最小限に直す:
               .github/workflows/applicant_sync.yml / .github/workflows/job_daily.yml /
               .github/workflows/hr_reconcile.yml / requirements.txt
               直してよい行: runs-on / python-version / uses の版 / pip install と playwright install の行 / requirements の版。
               前に成功していた環境に戻す (例: OS を固定する) ほうを、版を上げるより優先する。
            3. 次のものは変えない: 実行の引数 (--actual / --dry-run など)、環境変数、secret、cache の保存・復元の段、
               concurrency、スクリプト (scripts/ 以下) の中身。原因がそこにあるなら直さずに報告だけする。
            4. 最後に必ず .autofix/report.md を日本語で書く: 原因 (ログの該当行を1〜3行引用)、直したこと、
               直さなかった場合はその理由と人がすべきこと。secret の値・氏名・電話・メール・応募者id・顧客名・URL は書かない。
            git commit・push・PR の作成はしないこと (後の段が行う)。
      - name: 差分と原因を Issue にして知らせる
        run: |
          set -euo pipefail
          notify() { [ -n "$SLACK" ] && curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$1" '{text:$t}')" "$SLACK" >/dev/null || true; }
          REPORT=$( [ -s .autofix/report.md ] && cat .autofix/report.md || echo "（報告が書かれませんでした）" )
          gh label create auto-fix -R "$R" --color B60205 --description "自動修正" 2>/dev/null || true
          if git diff --quiet; then
            URL=$(gh issue create -R "$R" --label auto-fix --title "自動修正できない失敗: $WF_NAME / $FAILED_JOB" \
              --body "$(printf '失敗した回: %s\n\n%s\n' "$RUN_URL" "$REPORT")")
            notify "🛑 $WF_NAME / $FAILED_JOB の失敗は自動では直せませんでした。人の確認が必要です: $URL"
            exit 0
          fi
          OK=true; NG=""
          while read -r f; do
            grep -qxF "$f" <<< "$ALLOWED_FILES" || { OK=false; NG+="- 許可外のファイル: $f"$'\n'; }
          done < <(git diff --name-only)
          while read -r l; do
            if ! grep -Eq "$ALLOWED_LINE" <<< "$l" || grep -Eq "$DENY_LINE" <<< "$l"; then
              OK=false; NG+="- 許可外の行: \`$l\`"$'\n'
            fi
          done < <(git diff -U0 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | sed -E 's/^[+-]//' | grep -vE '^\s*(#.*)?$')
          if [ "$OK" = true ]; then JUDGE="実行環境の行だけの変更です。"; else JUDGE=$(printf '実行環境の設定以外にも触っています。よく確かめてください。\n%s' "$NG"); fi
          DIFF=$(git diff | head -c 50000)
          BODY=$(printf '失敗した回: %s\n\n%s\n\n## 判定\n%s\n\n## 差分\n```diff\n%s\n```\n\n## 入れ方\n手元の Claude Code に「Hubspot_Job-Posting の自動修正 Issue #番号 を入れて」と頼むと、この差分で PR を作ります。マージは人が行います。入れたらこの Issue を閉じてください (開いているあいだは次の自動修正を動かしません)。\n' \
            "$RUN_URL" "$REPORT" "$JUDGE" "$DIFF")
          URL=$(gh issue create -R "$R" --label auto-fix --title "自動修正の案: $WF_NAME / $FAILED_JOB" --body "$BODY")
          notify "🔧 $WF_NAME / $FAILED_JOB の直し方を Claude が作りました。確かめて入れてください: $URL"
